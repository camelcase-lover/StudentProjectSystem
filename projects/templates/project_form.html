{% extends "base.html" %}

{% block title %}{{ title }} - Student Project Management System{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px; color: #1e3a8a;">{{ title }}</h2>

    <!-- ModelForm Submission (Question 5b, 5c) -->
    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #dc2626; font-size: 0.85rem; margin-top: 4px;">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ button_text }}</button>
            <a href="{% url 'project_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
